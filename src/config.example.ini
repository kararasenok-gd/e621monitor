[bot]
token = YOUR_TELEGRAM_BOT_TOKEN
debug = false
log_level = INFO

[database]
# sqlite | postgres | mysql
driver = sqlite

# SQLite
sqlite_path = data/bot.db

# Postgres
pg_user = postgres
pg_password = password
pg_host = localhost
pg_port = 5432
pg_db = botdb

# MySQL
mysql_user = root
mysql_password = password
mysql_host = localhost
mysql_port = 3306
mysql_db = botdb

[art_source]
base_url = https://e621.net
username = YOUR_USERNAME
api_key = YOUR_API_KEY

[watch]
check_every_seconds = 90
art_retention_hours = 72
; Load tag aliases database
load_aliases = true
aliases_url = https://static1.e621.net/data/db_export/tag_aliases.csv.gz
; 0 = only on start | In hours
aliases_refresh = 24

[autoposting]
enabled = false
check_every_seconds = 60
; Set to -100 to disable specific rating
channel_id_safe = -100
channel_id_questionable = -100
channel_id_explicit = -100
score_limit = 50
post_limit = 50
; Blacklisted tag. Separated by space
blacklisted=fart feces foot_fetish vore young urine diaper
; Tags that should be kept when post length more than 1024 symbols. Separated by space
keep=male female male/male male/female female/female intersex solo duo sex cum group sound_warning

; You can run Redis server in docker. Read more here: https://github.com/kararasenok-gd/e621monitor/#3-redis-server-for-caching
[redis]
host=localhost
port=6379
db=0
username=
pass=

[ffmpeg]
; Number of threads ffmpeg may use per conversion. Lower values use less RAM but convert slower. 0 = ffmpeg default (auto).
threads = 1
; Hard memory limit (in MB) enforced on the ffmpeg process, so it can't OOM-kill the bot. Linux/macOS only, ignored on Windows. 0 = no limit.
memory_limit_mb = 512